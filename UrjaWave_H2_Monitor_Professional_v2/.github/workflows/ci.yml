name: UrjaWave CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix: {dir: [backend, frontend]}
    defaults:
      run: {working-directory: ${{ matrix.dir }}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm install
      - run: npm run build --if-present
